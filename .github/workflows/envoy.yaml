name: envoy

# Checks the Envoy builds that envoybin/manifest.go pins. A verify job checks
# the provenance of its build. It fails when a hash, a signature, an
# attestation, or the version commit of the build does not match. A verify job
# also fails when its build of the pinned version does not exist. Tetrate
# publishes the macOS build after the Envoy release, so a bump waits with
# failed jobs until that build exists.
#
# A verify job then loads the proxy bootstraps of terrarium with its build. It
# fails when the build rejects a bootstrap, for example because the build
# lacks an Envoy extension that the bootstrap names. The verify jobs therefore
# also run for a change to the code that generates the bootstraps.
#
# The workflow runs for every pull request, and the envoy-pin job reports its
# result under one fixed name. Two rules keep a pin that fails a check out of
# the main branch:
#
# - Renovate merges its bump of the pin itself, and only after every check of
#   the pull request passed. The package rule of the pin in
#   .github/renovate.json5 sets platformAutomerge to false for that purpose.
# - GitHub refuses the merge of every pull request with a failed envoy-pin
#   check when the required status checks of the main branch include
#   envoy-pin. The required status checks are a setting of the repository on
#   GitHub, and no file in the repository holds them. Without that setting, a
#   person can merge a pull request whose pin fails a check.
#
# Do not require a verify job. The verify jobs run only for a change to a file
# that they check, and GitHub holds a pull request until every required check
# reports a result.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: envoy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A path filter on the trigger skips the whole workflow, and then the
  # envoy-pin job reports no result. This job applies the filter instead.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.diff.outputs.verify }}
    steps:
      # A push can hold any number of commits, so the commit before the push
      # can sit at any depth of the history.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The verify output is "true" when the change touches a file that the
      # verify jobs check. The first group of paths holds the pin, the tool
      # that checks it, the Go workspace, and this workflow. The second
      # group holds the code that generates the proxy bootstraps and the
      # dependencies of that code. For a pull request, the checkout is the
      # merge commit, and its first parent is the base branch. For a push,
      # the base is the commit before the push. A manual run has no base, and
      # the history does not hold the base of every push. The output is
      # "true" in both cases, so the verify jobs run whenever the diff is
      # unknown.
      - name: Find changes that the verify jobs check
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base='HEAD^1' ;;
            push) base="$BEFORE" ;;
            *) base='' ;;
          esac

          verify=true
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            if git diff --quiet "$base" HEAD -- \
              envoybin \
              cmd/envoymanifest \
              go.work \
              go.work.sum \
              .github/workflows/envoy.yaml \
              cmd/terrarium \
              envoy \
              config \
              certs \
              go.mod \
              go.sum; then
              verify=false
            fi
          fi

          echo "verify=$verify" >>"$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.platform }})
    needs: [changes]
    if: ${{ needs.changes.outputs.verify == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One runner for each platform of the manifest. The verify command
        # runs the pinned binary, so each runner must be the platform that
        # it checks. The command fails when the runner is another platform.
        # The macOS runner must be an Apple Silicon machine.
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The job trusts no state of an earlier run, so it restores no cache.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: false

      - name: Verify the pinned Envoy build
        run: go run ./cmd/envoymanifest verify "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
          # The gh CLI reads the token for `gh attestation verify`, and the
          # command sends it with its request to the GitHub API.
          GH_TOKEN: ${{ github.token }}

      # The test generates a proxy bootstrap for each kind of policy. The
      # bootstraps together name every Envoy extension type and every format
      # command that a proxy bootstrap can name. The test installs the pinned
      # build into the directory of the variable, the way that `terrarium
      # proxy` installs it, and runs the build with `--mode validate` on each
      # bootstrap. Without the variable, the test skips. The step runs after
      # the provenance checks, so it runs only a build that passed them.
      - name: Load the proxy bootstraps with the pinned Envoy build
        run: go test -count=1 -run '^TestPinnedEnvoyLoadsProxyBootstraps$' ./cmd/terrarium
        env:
          TERRARIUM_TEST_ENVOY_DIR: ${{ runner.temp }}/envoy

  # This job is the check to require for a merge. It runs for every change,
  # and it passes only when every verify job passed or the change does not
  # touch a file that the verify jobs check. The always() condition is
  # necessary. Without it, GitHub skips this job when a verify job fails, and
  # a skipped job satisfies a required check.
  result:
    name: envoy-pin
    needs: [changes, verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the other jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_NEEDED: ${{ needs.changes.outputs.verify }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "changes: $CHANGES_RESULT, verify needed: $VERIFY_NEEDED, verify: $VERIFY_RESULT"

          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::The changes job did not succeed, so the files of the change are unknown."
            exit 1
          fi

          case "$VERIFY_RESULT" in
            success)
              echo "Every verify job passed."
              ;;
            skipped)
              if [ "$VERIFY_NEEDED" != false ]; then
                echo "::error::The verify jobs did not run for a change to a file that they check."
                exit 1
              fi

              echo "The change does not touch a file that the verify jobs check, so no verify job ran."
              ;;
            *)
              echo "::error::A verify job did not pass."
              exit 1
              ;;
          esac
